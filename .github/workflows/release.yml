# Tests on every OS; on a v* tag, also publishes one self-contained tarball per platform
# (bundled Node + node_modules), which install.sh / install.ps1 download.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          # ponytail: built against glibc 2.35; older distros need a build in an older container.
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-latest, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - run: npm test
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist/maestro
          cp -R package.json LICENSE src node_modules dist/maestro/
          cp "$(node -p process.execPath)" dist/maestro/
          find dist -name '*.pdb' -delete
          tar -czf maestro-${{ matrix.target }}.tar.gz -C dist maestro
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: maestro-${{ matrix.target }}.tar.gz
